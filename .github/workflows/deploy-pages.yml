# Déploie la version web autonome (lob-terminal.html) sur GitHub Pages.
# Prérequis : dépôt public (Pages est payant pour les dépôts privés).
# Le site est ensuite servi sur https://7noctis7.github.io/Order_Book_Trades/
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le site — l'app web devient la page d'accueil
        run: |
          mkdir _site
          cp lob-terminal.html _site/index.html

      - name: Activer Pages si ce n'est pas déjà fait
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
