# Déploie la version web autonome (lob-terminal.html) sur GitHub Pages.
# Pages est configuré en source « GitHub Actions » (Settings → Pages) :
# chaque push sur main publie l'app comme page d'accueil du site.
# Site : https://7noctis7.github.io/Order_Book_Trades/
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Construire le site — l'app web devient la page d'accueil
        run: |
          mkdir -p _site
          cp lob-terminal.html _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
