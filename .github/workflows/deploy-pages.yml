# Publie la version web autonome (lob-terminal.html) sur GitHub Pages via la
# branche gh-pages : GitHub active Pages automatiquement pour cette branche,
# aucun réglage manuel n'est nécessaire (dépôt public requis).
# Site : https://7noctis7.github.io/Order_Book_Trades/
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construire le site — l'app web devient la page d'accueil
        run: |
          mkdir -p _site
          cp lob-terminal.html _site/index.html

      - name: Publier sur la branche gh-pages
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Déploiement du site (${GITHUB_SHA})"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
